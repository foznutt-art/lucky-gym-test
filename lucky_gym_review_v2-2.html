<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lucky Gym SNK — รีวิวร้านเรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0a0c0a;
    --panel: #121613;
    --steel: #1b211c;
    --steel-border: #2a332b;
    --volt: #c8ff4d;
    --volt-dim: #6f8a3a;
    --bone: #eeeee3;
    --grey: #7e8d82;
    --shadow: rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    min-height:100dvh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(200,255,77,.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(200,255,77,.04), transparent 60%),
      var(--ink);
    background-attachment: fixed;
    color: var(--bone);
    font-family: 'Inter', system-ui, -apple-system, 'Noto Sans Thai', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 34px 20px 30px;
    position:relative;
    overflow-x:hidden;
  }
  /* subtle concrete grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0px, transparent 1px, transparent 2px);
    pointer-events:none;
    z-index:0;
  }

  .stage{ position:relative; z-index:1; width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; }

  /* ---- barbell signature ---- */
  .barbell{
    width:100%;
    max-width: 340px;
    height: 46px;
    margin-bottom: 22px;
    opacity: 0;
    animation: bar-in .6s cubic-bezier(.2,.9,.25,1.2) .1s forwards;
  }
  @keyframes bar-in{
    from{ opacity:0; transform: scaleX(.85); }
    to{ opacity:1; transform: scaleX(1); }
  }

  .eyebrow{
    font-family:'Bebas Neue', 'Arial Narrow', sans-serif;
    letter-spacing: 6px;
    font-size: 14px;
    color: var(--volt);
    margin-bottom: 10px;
    opacity:0;
    animation: rise .5s ease .35s forwards;
  }

  h1{
    font-family:'Bebas Neue', 'Arial Narrow', sans-serif;
    font-size: 44px;
    line-height: 0.98;
    text-align:center;
    letter-spacing: 0.5px;
    color: var(--bone);
    margin-bottom: 14px;
    opacity:0;
    animation: rise .55s ease .45s forwards;
  }
  h1 em{
    font-style:normal;
    color: var(--volt);
    display:block;
  }

  .sub{
    color: var(--grey);
    text-align:center;
    font-size: 14.5px;
    line-height:1.6;
    max-width: 300px;
    margin-bottom: 32px;
    opacity:0;
    animation: rise .5s ease .55s forwards;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .cards{ width:100%; display:flex; flex-direction:column; gap:14px; }

  .card{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    background: linear-gradient(180deg, var(--steel), #161b17);
    border: 1px solid var(--steel-border);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration:none;
    color: var(--bone);
    box-shadow: 0 10px 24px -14px var(--shadow);
    opacity:0;
    transform: translateY(14px);
    animation: card-in .5s cubic-bezier(.2,.8,.25,1) forwards;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:nth-child(1){ animation-delay: .65s; }
  .card:nth-child(2){ animation-delay: .78s; }
  .card:nth-child(3){ animation-delay: .91s; }
  @keyframes card-in{ to{ opacity:1; transform:translateY(0); } }

  .card:active{ transform: scale(.97); border-color: var(--volt-dim); }

  /* plate icon */
  .plate{
    position:relative;
    width:52px; height:52px; min-width:52px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #333c34, #14181510 70%), #191f1b;
    border: 3px solid #2c362e;
    display:flex; align-items:center; justify-content:center;
  }
  .plate::before{
    content:"";
    position:absolute; inset:6px;
    border-radius:50%;
    border: 1px dashed #384339;
  }
  .plate .badge{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
  }
  .plate .badge svg{ width:15px; height:15px; }
  .plate.fb .badge{ background:#1877F2; }
  .plate.tt .badge{ background:#0d0d0d; border:1px solid #333; }

  .label{ display:flex; flex-direction:column; gap:1px; flex:1; }
  .label .name{
    font-family:'Bebas Neue','Arial Narrow',sans-serif;
    font-size: 21px;
    letter-spacing: 0.5px;
  }
  .label .desc{ font-size: 12.5px; color: var(--grey); }

  .go{
    width:30px; height:30px; min-width:30px;
    border-radius:50%;
    border:1px solid var(--steel-border);
    display:flex; align-items:center; justify-content:center;
  }
  .go svg{ width:13px; height:13px; }

  .footer{
    margin-top: 38px;
    text-align:center;
    color: var(--grey);
    font-size: 11.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity:0;
    animation: rise .5s ease 1.05s forwards;
  }
  .footer b{ color: var(--volt); }

  @media (prefers-reduced-motion: reduce){
    .barbell, .eyebrow, h1, .sub, .card, .footer{ animation: none !important; opacity:1 !important; transform:none !important; }
  }

  @media (max-width: 340px){
    h1{ font-size: 38px; }
  }
</style>
</head>
